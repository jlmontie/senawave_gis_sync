; ============================================================================
; Senawave GIS sync - settings.  Edit the paths and URLs below.
; ============================================================================

[general]
; File geodatabase your ArcGIS Pro project reads from (created on first run)
gdb = C:\GIS\Senawave\Senawave_Network.gdb
; Logs, review reports and dry-run output go here
work_folder = C:\GIS\Senawave\sync_work
; Coordinate system for the output feature classes. 4326 = WGS84 (same as KML).
; To match your BEAD project, use the WKID shown in your map's Properties >
; Coordinate Systems, and set the transformation below.
output_wkid = 4326
; geographic_transformation = WGS_1984_(ITRF00)_To_NAD_1983
; A load is refused if it has fewer rows than this share of what is already there
min_row_ratio = 0.5

[portal]
; How the portal asks for credentials.
;   basic  - the browser pops up its own grey "Sign in" box  (this is what
;            portal.senawave.com does; nothing else to configure here)
;   digest - same box, but the server uses Digest authentication
;   form   - a web page with username/password boxes; then set login_url and
;            the field names below
auth = basic

; Credentials are read from Windows environment variables, never stored here
username_env = SENAWAVE_PORTAL_USER
password_env = SENAWAVE_PORTAL_PASSWORD

; Only needed when auth = form
; login_url = https://portal.senawave.com/billing/admin/login.php
; post_url = https://portal.senawave.com/billing/admin/login.php
; username_field = username
; password_field = password
; extra_field.submit = Login

; ----------------------------------------------------------------------------
; Sources.  Each needs parser = design | address_ids | autobill
; and either path = (file / NAS) or url = (portal feed).
; ----------------------------------------------------------------------------
[source:design]
parser = design
path = \\NAS\Share\Path\To\Q-NETWORK LINK.kmz
prefix = Design_
min_rows = 1000

[source:address_ids]
parser = address_ids
url = https://portal.senawave.com/generate_kml.php
; Until the login works, download the file by hand and use path = instead:
; path = C:\GIS\Senawave\downloads\AddressIDs.kml
prefix = Cust_
min_rows = 1000

[source:autobill]
parser = autobill
url = https://portal.senawave.com/REPLACE_WITH_AUTOBILL_FEED.php
; path = C:\GIS\Senawave\downloads\AutoBill-Customers.kml
prefix = Cust_
min_rows = 1000
